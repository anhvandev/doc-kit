<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
{{.CSS}}
</style>
</head>
<body>
<div class="page{{if .Index}} index{{end}}">
<main>
{{.Body}}
</main>
{{if or .Meta .TOC}}<aside class="meta">
{{if .Meta}}<table>
<tbody>
{{range .Meta}}<tr><th scope="row">{{.Key}}</th><td{{if eq .Key "id"}} class="id"{{end}}>{{if eq .Key "status"}}<span class="status">{{.Value}}</span>{{else}}{{.Value}}{{end}}</td></tr>
{{end}}</tbody>
</table>
{{end}}{{if .TOC}}<nav class="toc" aria-label="Mục lục">
<ul>
{{range .TOC}}<li class="l{{.Level}}"><a href="#{{.ID}}">{{.Text}}</a></li>
{{end}}</ul>
</nav>
{{end}}</aside>{{end}}
</div>
{{if .HasMermaid}}<script>
{{.Mermaid}}
</script>
<script>mermaid.initialize({startOnLoad: true, theme: "neutral"});</script>
{{end}}</body>
</html>
